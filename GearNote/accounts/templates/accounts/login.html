{% extends 'base.html' %}

{% block title %}Accedi - GearNote{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Bentornato!</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="btn-primary btn-submit">Entra</button>
    </form>
    
    <a href="{% url 'accounts:registrati' %}" class="auth-link">Non hai un account? Registrati qui.</a>
</div>
{% endblock content %}
